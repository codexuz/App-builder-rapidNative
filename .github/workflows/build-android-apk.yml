name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_slug:
        description: 'App folder under apps/ (e.g. impulse-learning-world)'
        required: true
        default: 'impulse-learning-world'
        type: string
      release_tag:
        description: 'GitHub Release tag for direct APK download'
        required: false
        default: 'impulse-learning-world-latest'
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install app dependencies
        working-directory: apps/${{ inputs.app_slug }}
        run: pnpm install --no-frozen-lockfile

      - name: Verify TypeScript
        working-directory: apps/${{ inputs.app_slug }}
        run: pnpm exec tsc --noEmit

      - name: Expo Android Prebuild
        working-directory: apps/${{ inputs.app_slug }}
        run: npx expo prebuild --platform android --no-install

      - name: Build Standalone Debug-Signed APK (arm64-v8a + armeabi-v7a)
        working-directory: apps/${{ inputs.app_slug }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.enableMinifyInReleaseBuilds=false \
            --no-daemon

      - name: Stage APK artifact
        run: |
          mkdir -p dist-apk
          APK_SRC="apps/${{ inputs.app_slug }}/android/app/build/outputs/apk/release/app-release.apk"
          APK_DEST="dist-apk/${{ inputs.app_slug }}-debug.apk"
          cp "$APK_SRC" "$APK_DEST"
          ls -lh "$APK_DEST"

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_slug }}-debug-apk
          path: dist-apk/${{ inputs.app_slug }}-debug.apk
          retention-days: 30

      - name: Publish direct APK download on GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ inputs.app_slug }}-latest"
          fi
          APK_FILE="dist-apk/${{ inputs.app_slug }}-debug.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "${{ inputs.app_slug }} — Android Debug APK" \
              --notes "Standalone debug-signed Android APK (arm64-v8a + armeabi-v7a) with JS bundle, Skia native libs, and generated assets embedded. Download and install directly on Android (no Metro server required)."
          fi
